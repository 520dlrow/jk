<!DOCTYPE html
<html lang="ar" dir="rtl"
<head
    <meta charset="UTF-8"
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    <titleحاسبة بسيطة</title
    <style
        /* إعدادات عامة تتناسب مع شاشات الهواتف */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212; /* لون داكن مريح للعين */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* لمنع التمرير في التطبيق */
        }
        
        .calculator {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 350px;
        }

        .display {
            width: 100%;
            height: 80px;
            background-color: #2c2c2c;
            border: none;
            color: #ffffff;
            text-align: left;
            font-size: 36px;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-sizing: border-box;
            direction: ltr; /* الأرقام دائماً من اليسار لليمين */
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            padding: 20px 0;
            font-size: 24px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            background-color: #333333;
            color: white;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:active {
            background-color: #555555;
            transform: scale(0.95);
        }

        .operator {
            background-color: #ff9800; /* لون برتقالي للعمليات الحسابية */
            color: white;
        }

        .operator:active {
            background-color: #e68a00;
        }

        .clear {
            background-color: #f44336; /* لون أحمر لزر المسح */
            grid-column: span 4;
        }

        .clear:active {
            background-color: #d32f2f;
        }
    </style
</head
<body

    <div class="calculator"
        <input type="text" class="display" id="display" disabled
        <div class="buttons"
            <button onclick="appendValue('7')"7</button
            <button onclick="appendValue('8')"8</button
            <button onclick="appendValue('9')"9</button
            <button class="operator" onclick="appendValue('/')"÷</button

            <button onclick="appendValue('4')"4</button
            <button onclick="appendValue('5')"5</button
            <button onclick="appendValue('6')"6</button
            <button class="operator" onclick="appendValue('*')"×</button

            <button onclick="appendValue('1')"1</button
            <button onclick="appendValue('2')"2</button
            <button onclick="appendValue('3')"3</button
            <button class="operator" onclick="appendValue('-')"-</button

            <button onclick="appendValue('.')".</button
            <button onclick="appendValue('0')"0</button
            <button class="operator" onclick="calculate()"=</button
            <button class="operator" onclick="appendValue('+')"+</button

            <button class="clear" onclick="clearDisplay()"مسح (C)</button
        </div
    </div

    <script
        const display = document.getElementById('display');

        // إضافة الرقم أو العملية للشاشة
        function appendValue(value) {
            // تحويل علامات القسمة والضرب الشكلية إلى علامات برمجية صحيحة
            if (value === '÷') value = '/';
            if (value === '×') value = '*';
            
            display.value += value;
        }

        // مسح الشاشة
        function clearDisplay() {
            display.value = '';
        }

        // تنفيذ العملية الحسابية
        function calculate() {
            try {
                // استخدام دالة eval لحساب النص البرمجي
                let result = eval(display.value);
                // التأكد من أن النتيجة ليست غير معرفة
                if (result !== undefined) {
                    display.value = result;
                }
            } catch (error) {
                // في حال إدخال معادلة خاطئة (مثل ++ أو //)
                display.value = 'خطأ';
                setTimeout(clearDisplay, 1500); // مسح الخطأ بعد ثانية ونصف
            }
        }
    </script
</body
</html
